// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}
repositories {
    google()
}

// libXray (XTLS, MIT) ships as a release zip, not on Maven. Fetch the pinned AAR once, check sha256,
// and expose it as com.github.xtls:libxray from a local Maven layout under build/.
def libXrayVersion = '26.9.30'
def libXraySha256 = '394b59d147b37ab46003bd3f1d687ed3b2f637cabfc0cb863f179c5a87bddde3'
def libXrayRepo = new File(rootDir, "build/libxray-repo")
def ensureLibXray = {
    File aar = new File(libXrayRepo, "com/github/xtls/libxray/${libXrayVersion}/libxray-${libXrayVersion}.aar")
    if (aar.exists()) {
        return
    }
    File zip = new File(rootDir, "build/libxray-${libXrayVersion}.zip")
    zip.parentFile.mkdirs()
    if (!zip.exists()) {
        File part = new File(zip.parentFile, zip.name + ".part")
        URLConnection connection = new URL("https://github.com/XTLS/libXray/releases/download/v${libXrayVersion}/libxray-android.zip").openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 120000
        connection.inputStream.withCloseable { input ->
            part.withOutputStream { output -> output << input }
        }
        if (!part.renameTo(zip)) {
            throw new GradleException("libXray ${libXrayVersion} download could not be moved into place")
        }
    }
    String actual = java.security.MessageDigest.getInstance('SHA-256').digest(zip.bytes).encodeHex().toString()
    if (actual != libXraySha256) {
        zip.delete()
        throw new GradleException("libXray ${libXrayVersion} checksum mismatch: ${actual}")
    }
    aar.parentFile.mkdirs()
    // The AAR is the completion marker: the POM goes first, the AAR is moved into place last.
    new File(aar.parentFile, "libxray-${libXrayVersion}.pom").text =
        "<project><modelVersion>4.0.0</modelVersion><groupId>com.github.xtls</groupId><artifactId>libxray</artifactId>" +
        "<version>${libXrayVersion}</version><packaging>aar</packaging></project>"
    File temp = new File(aar.parentFile, aar.name + ".tmp")
    new java.util.zip.ZipFile(zip).withCloseable { archive ->
        def entry = archive.getEntry('libxray-android/libXray.aar')
        if (entry == null) {
            throw new GradleException("libXray zip has no libxray-android/libXray.aar")
        }
        temp.withOutputStream { output -> output << archive.getInputStream(entry) }
    }
    java.nio.file.Files.move(temp.toPath(), aar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
}
ensureLibXray()

// Strip JLatexMath fonts we don't ship (transitive AAR assets from
// io.noties.markwon:ext-latex -> ru.noties:jlatexmath-android, ~764 KB total under
// assets/org/scilab/forge/jlatexmath/fonts/). Has to live in the APK modules — a
// library's androidResources.ignoreAssetsPattern doesn't filter packaging in apps
// that consume it. Using subprojects keeps it in one place.
//   keep:  base/, latin/, maths/, euler/  (\mathbb, \mathcal, \mathfrak still work)
//   drop:  latin/optional/, maths/optional/  (~290 KB; \textbf/\textit/\mathds fall back)
//          licences/                          (~20 KB; pure license text files)
subprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup 'com.github.davidliu'
            }
        }
        maven {
            url libXrayRepo.toURI()
            content {
                includeGroup 'com.github.xtls'
            }
        }
    }

    plugins.withId('com.android.application') {
        androidComponents {
            onVariants(selector().all()) { variant ->
                // LiveKit's Rust library does not support 32-bit x86.
                Set<String> packagedAbis = ['armeabi-v7a', 'arm64-v8a', 'x86_64'].toSet()
                if (variant.buildType == 'debug' && project.hasProperty('IMPULSEM_DEBUG_ABIS')) {
                    packagedAbis.retainAll(IMPULSEM_DEBUG_ABIS.split(',').collect { it.trim() })
                }
                for (String abi : ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']) {
                    if (!packagedAbis.contains(abi)) {
                        variant.packaging.jniLibs.excludes.add("lib/${abi}/**")
                    }
                }
            }
        }

        android {
            androidResources {
                ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
            }
        }
    }

    if (project.projectDir.absolutePath.contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}
